name: Agent Implement PR

on:
  # pull_request, not pull_request_target: on a fork PR this gets no secrets
  # and a read-only token, so checking out and running the PR's code is safe.
  # Same-repo PRs (the ones the agent opens) keep secrets as before.
  # pull_request does not fire on PRs with merge conflicts (GitHub can't build
  # the merge ref) — resolving those is agent-update-branch's job.
  pull_request:
    types: [labeled]

jobs:
  # ADR 0025's shard key, computed where arithmetic is legal: GitHub
  # expressions have no `%` operator (a literal `% 3` in the concurrency
  # group made all four workflows unparseable), so a shell step reduces
  # the unit number mod 3 and the heavy job's concurrency group reads it
  # through `needs`. `||` covers both event shapes in one expression;
  # a numberless event aborts the shard job instead of silently
  # queuing every run into shard 0.
  shard:
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      n: ${{ steps.mod.outputs.n }}
    steps:
      - id: mod
        run: |
          N="${{ github.event.issue.number || github.event.pull_request.number }}"
          # A labeled event always carries the unit number (ADR 0025); an
          # empty one is event-shape drift — reject, never guess shard 0.
          : "${N:?event carried no issue/PR number — cannot compute the shard}"
          echo "n=$(( N % 3 ))" >> "$GITHUB_OUTPUT"

  implement-pr:
    needs: shard
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # ADR 0025: repo-wide three-shard cap on concurrent agent runs. The
      # PR number is the shard key, so same-PR mutation stays serialized
      # (the old agent-mutate-pr-<N> guarantee) while different PRs share
      # a shard and queue.
      group: agent-llm-${{ needs.shard.outputs.n }}
      cancel-in-progress: false
      # queue: max (not the default single): by default GitHub keeps one
      # run pending per group and a newer queued run cancels it — a lost
      # run even with cancel-in-progress: false.
      queue: max
    permissions:
      contents: write
      pull-requests: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BRANCH_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # Provider/model config lives here, not in code (tune cost and quality
      # by editing env vars only). Consumed by agentFromEnv() in
      # .sandcastle/agent-workflows/shared/common.ts.
      AGENT_PROVIDER: zai
      AGENT_MODEL: glm-5.3-flash:max

    steps:
      - name: Refuse closed PR
        if: github.event.pull_request.state != 'open'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run: PR #${PR_NUMBER} is not open."

      - name: Transition labels
        if: github.event.pull_request.state == 'open'
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout PR branch
        if: github.event.pull_request.state == 'open'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Checkout credentials persist into git push. The push must be
          # able to carry .github/workflows/* changes, which a plain
          # GITHUB_TOKEN is refused for (README, deviations entry 8).
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Prepare branch
        if: github.event.pull_request.state == 'open'
        run: |
          git fetch origin main:main || git fetch origin main
          git checkout "$BRANCH" 2>/dev/null || git checkout -B "$BRANCH"
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"

      - name: Setup Node.js
        if: github.event.pull_request.state == 'open'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        if: github.event.pull_request.state == 'open'
        run: npm ci

      - name: Install pi CLI
        if: github.event.pull_request.state == 'open'
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Run implement-PR agent
        if: github.event.pull_request.state == 'open'
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: npx tsx .sandcastle/agent-workflows/implement-pr/implement-pr.ts

      - name: Push branch
        if: github.event.pull_request.state == 'open' && success()
        run: |
          if [ "$(cat "${RUNNER_TEMP}/has_commits.txt")" != "true" ]; then
            echo "No commits to push."
            exit 0
          fi
          set +e
          git push --force-with-lease="refs/heads/$BRANCH:$BRANCH_HEAD_SHA" origin "$BRANCH" 2> push_err.txt
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if grep -qiE "non-fast-forward|rejected|fetch first|stale info" push_err.txt; then
              echo "Branch advanced during implement-PR run." > "${RUNNER_TEMP}/failure_reason.txt"
              cat push_err.txt
              exit 1
            fi
            cat push_err.txt
            exit $status
          fi

      - name: Post thread replies
        if: github.event.pull_request.state == 'open' && success()
        env:
          REPLIES: ${{ runner.temp }}/implement_thread_replies.json
        run: |
          count=$(jq 'length' "$REPLIES")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            commentId=$(jq -r ".[$i].commentId" "$REPLIES")
            body=$(jq -r ".[$i].body" "$REPLIES")
            rest_id=$(gh api graphql -f query="query(\$id:ID!){ node(id:\$id){ ... on PullRequestReviewComment { databaseId } } }" -F id="$commentId" --jq '.data.node.databaseId')
            if [ -z "$rest_id" ] || [ "$rest_id" = "null" ]; then
              echo "Could not resolve REST id for $commentId; skipping" >&2
              continue
            fi
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments/${rest_id}/replies" -f body="$body"
          done

      - name: Post inline comments
        if: github.event.pull_request.state == 'open' && success()
        env:
          COMMENTS: ${{ runner.temp }}/implement_new_inline_comments.json
        run: |
          count=$(jq 'length' "$COMMENTS")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          head_sha=$(git rev-parse HEAD)
          for i in $(seq 0 $((count - 1))); do
            path=$(jq -r ".[$i].path" "$COMMENTS")
            line=$(jq -r ".[$i].line" "$COMMENTS")
            body=$(jq -r ".[$i].body" "$COMMENTS")
            gh api --method POST "repos/{owner}/{repo}/pulls/${PR_NUMBER}/comments" \
              -f commit_id="$head_sha" \
              -f path="$path" \
              -F line="$line" \
              -f side="RIGHT" \
              -f body="$body"
          done

      - name: Post top-level comments
        if: github.event.pull_request.state == 'open' && success()
        env:
          COMMENTS: ${{ runner.temp }}/implement_top_level_comments.json
        run: |
          count=$(jq 'length' "$COMMENTS")
          if [ "$count" -eq 0 ]; then
            exit 0
          fi
          for i in $(seq 0 $((count - 1))); do
            body=$(jq -r ".[$i].body" "$COMMENTS")
            gh pr comment "$PR_NUMBER" --body "$body"
          done

      - name: Update PR body
        if: github.event.pull_request.state == 'open' && success()
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: |
          if [ -s "$PR_BODY_FILE" ]; then
            # Same substitution as Agent Implement's "Open draft PR": the
            # agent drafts $GITHUB_* template variables it cannot resolve.
            sed -i \
              -e "s|\$GITHUB_SERVER_URL|$GITHUB_SERVER_URL|g" \
              -e "s|\$GITHUB_REPOSITORY|$GITHUB_REPOSITORY|g" \
              -e "s|\$GITHUB_RUN_ID|$GITHUB_RUN_ID|g" \
              "$PR_BODY_FILE"
            gh pr edit "$PR_NUMBER" --body-file "$PR_BODY_FILE"
          fi

      - name: Mark blocked on failure
        if: github.event.pull_request.state == 'open' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`agent:implement` PR run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `agent:implement` to retry.\n' "$reason" "$RUN_URL" > "$body_file"
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          gh pr comment "$PR_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always() && github.event.pull_request.state == 'open'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
